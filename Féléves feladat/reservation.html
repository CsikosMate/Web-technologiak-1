<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foglalás</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg custom-navbar">
        <div class="container">
            <a class="navbar-brand text-white" href="index.html">Autó bérlő</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Kezdőlap</a></li>
                    <li class="nav-item"><a class="nav-link" href="fleet.html">Flotta</a></li>
                    <li class="nav-item"><a class="nav-link" href="conditions.html">Feltételek</a></li>
                    <li class="nav-item"><a class="nav-link" href="reservation.html">Foglalás</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5" id="form-container">
        <h2 id="form-title">Autó foglalása</h2>
        <p>Kérjük, töltse ki az alábbi űrlapot!</p>

        <form id="reservation-form" class="mt-4 p-4 border rounded bg-white shadow-sm">
            
            <div class="mb-3">
                <label for="name" class="form-label">Teljes név:</label>
                <input type="text" id="name" class="form-control custom-form-input">
            </div>

            <div class="row">
                <div class="col-md-5 mb-3">
                    <label for="start-date" class="form-label">Bérlés kezdete:</label>
                    <input type="date" id="start-date" class="form-control custom-form-input">
                </div>

                <div class="col-md-5 mb-3">
                    <label for="end-date" class="form-label">Bérlés vége:</label>
                    <input type="date" id="end-date" class="form-control custom-form-input">
                </div>
                
                <div class="col-md-2 mb-3">
                    <label for="car-color" class="form-label">Preferált autó szín:</label>
                    <input type="color" id="car-color" class="form-control form-control-color custom-form-input" value="#000000">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label d-block">Biztosítás típusa:</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="insurance" id="base" value="base" checked>
                    <label class="form-check-label" for="base">Alap (benne van az árban)</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="insurance" id="full" value="full">
                    <label class="form-check-label" for="full">Full Casco (+3000 Ft/nap)</label>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label d-block">Extrák igénylése:</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="gps" value="gps">
                    <label class="form-check-label" for="gps">GPS navigáció (+1000 Ft/nap)</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="tow-bar" value="tow-bar">
                    <label class="form-check-label" for="tow-bar">Vonóhorog</label>
                </div>
            </div>

            <div class="mb-4">
                <label for="comment" class="form-label">Megjegyzés:</label>
                <textarea id="comment" rows="3" class="form-control custom-form-input"></textarea>
            </div>

            <button type="submit" class="btn custom-btn w-100">Foglalás leadása</button>
        </form>

    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
